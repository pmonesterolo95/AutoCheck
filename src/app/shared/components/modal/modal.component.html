@if (open) {
  <div class="modal-backdrop" (click)="close.emit()">
    <div class="modal" [style.maxWidth.px]="width" (click)="$event.stopPropagation()">
      <div class="modal-header">
        <h3>{{ title }}</h3>
        <button type="button" class="modal-close" (click)="close.emit()">✕</button>
      </div>
      <div class="modal-body">
        <ng-content></ng-content>
      </div>
    </div>
  </div>
}
